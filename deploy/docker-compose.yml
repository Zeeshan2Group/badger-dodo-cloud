# Local development stack: the same two containers that run on each EC2
# instance (web + nginx proxy), plus a MySQL container standing in for RDS.
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: badgerdodo
      MYSQL_USER: badger
      MYSQL_PASSWORD: localdevonly
      MYSQL_ROOT_PASSWORD: localrootonly
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  web:
    build: ../app
    environment:
      DB_HOST: db
      DB_USER: badger
      DB_PASSWORD: localdevonly
      DB_NAME: badgerdodo
      ENABLE_STRESS: "true"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
